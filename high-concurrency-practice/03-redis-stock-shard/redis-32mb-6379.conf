# 与 6380 成对使用。单进程实验不要用这份，用 redis-64mb.conf。
bind 127.0.0.1
port 6379
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6379.pid
logfile /tmp/miaosha-redis-6379.log
dir /tmp/miaosha-redis-6379
dbfilename dump.rdb
save ""
appendonly no
maxmemory 32mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
