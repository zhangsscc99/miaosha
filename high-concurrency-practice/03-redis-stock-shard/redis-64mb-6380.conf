# 第二个 64MB 进程，和 redis-64mb-6379.conf 成对。成功路径的胜出集合按进程各存一份。
bind 127.0.0.1
port 6380
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6380.pid
logfile /tmp/miaosha-redis-6380.log
dir /tmp/miaosha-redis-6380
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
