# 第一个 64MB 进程。单进程对照用 redis-64mb.conf，避免和 6380 同时抢同一个 pid 文件。
bind 127.0.0.1
port 6379
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6379.pid
logfile /tmp/miaosha-redis-6379.log
dir /tmp/miaosha-redis-6379
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
