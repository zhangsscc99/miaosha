apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seckill-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seckill-api
  minReplicas: 4
  maxReplicas: 200
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 20
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # 需要 prometheus-adapter 把 /stats 里的 QPS 暴露成 Pods 指标；
    # CPU 在秒杀瞬间有滞后，QPS 指标能更早触发扩容。
    - type: Pods
      pods:
        metric:
          name: seckill_requests_per_second
        target:
          type: AverageValue
          averageValue: "12000"
