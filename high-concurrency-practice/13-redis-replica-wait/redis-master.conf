# 一小部分资源：主库，内存上限 64MB。复制积压 1MB。没有 AOF。
# repl-diskless-sync-delay 默认是 5 秒，这里写成 0，避免把等待算进同步时间。
bind 127.0.0.1
port 6379
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-repl-6379.pid
logfile /tmp/miaosha-redis-repl-6379.log
dir /tmp/miaosha-redis-repl-6379
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
enable-debug-command local
repl-diskless-sync yes
repl-diskless-sync-delay 0
repl-backlog-size 1mb
replica-serve-stale-data yes
