# 和主库同一端口，打开 AOF。appendfsync 由场景在运行时改成 everysec 或 always。
bind 127.0.0.1
port 6379
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-repl-6379.pid
logfile /tmp/miaosha-redis-repl-6379.log
dir /tmp/miaosha-redis-repl-6379
dbfilename dump.rdb
save ""
appendonly yes
appendfsync everysec
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
enable-debug-command local
repl-diskless-sync yes
repl-diskless-sync-delay 0
repl-backlog-size 1mb
replica-serve-stale-data yes
