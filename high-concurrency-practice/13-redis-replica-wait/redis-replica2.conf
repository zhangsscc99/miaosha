# 第二个从库，用来看 min-replicas-to-write 1 时摘掉一个还有没有写。
bind 127.0.0.1
port 6381
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-repl-6381.pid
logfile /tmp/miaosha-redis-repl-6381.log
dir /tmp/miaosha-redis-repl-6381
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
enable-debug-command local
replicaof 127.0.0.1 6379
replica-read-only yes
replica-serve-stale-data yes
