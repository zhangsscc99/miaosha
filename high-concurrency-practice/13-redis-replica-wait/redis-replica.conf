# 从库。和主库在同一台机器的另一个端口，不是第二台机器。
bind 127.0.0.1
port 6380
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-repl-6380.pid
logfile /tmp/miaosha-redis-repl-6380.log
dir /tmp/miaosha-redis-repl-6380
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
enable-debug-command local
replicaof 127.0.0.1 6379
replica-read-only yes
replica-serve-stale-data yes
