# 第二个 Redis，用来和 6379 抢同一个父 cgroup 的 1 个核。
bind 127.0.0.1
port 6380
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6380.pid
logfile /tmp/miaosha-redis-6380.log
dir /tmp/miaosha-redis-6380
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
