# 横向扩容对照的第二个进程。两进程内存合计仍是 64MB。
bind 127.0.0.1
port 6380
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6380.pid
logfile /tmp/miaosha-redis-6380.log
dir /tmp/miaosha-redis-6380
dbfilename dump.rdb
save ""
appendonly no
maxmemory 32mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 100
