# 一小部分资源：单进程 Redis，内存上限 64MB，关掉 RDB。
# AOF 由对应场景在运行时打开。淘汰策略保持 noeviction，避免把到期订单静默删掉。
bind 127.0.0.1
port 6379
protected-mode yes
daemonize yes
pidfile /tmp/miaosha-redis-6379.pid
logfile /tmp/miaosha-redis-6379.log
dir /tmp/miaosha-redis-6379
dbfilename dump.rdb
save ""
appendonly no
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-backlog 1024
databases 1
hz 10
