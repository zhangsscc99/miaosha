# 异步刷盘，但是先写堆外缓冲，并且把提交间隔拉长。用来看进程被 kill -9 时缓冲里的消息还在不在。
# 这不是发行版默认。默认是 wakeCommitWhenPutMessage=true，提交间隔 200 毫秒。
brokerClusterName=miaosha
brokerName=broker-a
brokerId=0
namesrvAddr=127.0.0.1:9876
brokerIP1=127.0.0.1
listenPort=10911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
defaultTopicQueueNums=4
traceTopicEnable=false
aclEnable=false
registerNameServerPeriod=1000
storePathRootDir=/tmp/miaosha-rocketmq/store
storePathCommitLog=/tmp/miaosha-rocketmq/store/commitlog
# 64MB 的堆外缓冲在这台机器上会把第一次发送堵到 putMessageTimeout。这里用 16MB，两条缓冲一共 32MB。
mappedFileSizeCommitLog=16777216
mappedFileSizeConsumeQueue=600000
transientStorePoolEnable=true
transientStorePoolSize=2
# putMessageTimeout 默认 8000。提交间隔如果大于它，发送会在返回前被判 system busy。
# 这里改成 2000，让发送有机会在超时前回来，再看 kill -9 还剩多少。
wakeCommitWhenPutMessage=false
commitIntervalCommitLog=2000
commitCommitLogLeastPages=10000
commitCommitLogThoroughInterval=2000
flushIntervalCommitLog=500
messageDelayLevel=1s 5s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s
transactionTimeOut=1000
transactionCheckInterval=2000
diskMaxUsedSpaceRatio=95
fileReservedTime=48
deleteWhen=04
