# 一个本机 broker。堆和直接内存不在这个文件里，在 run.sh 改过的启动脚本里。
brokerClusterName=miaosha
brokerName=broker-a
brokerId=0
namesrvAddr=127.0.0.1:9876
brokerIP1=127.0.0.1
listenPort=10911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
defaultTopicQueueNums=4
traceTopicEnable=false
aclEnable=false
# 默认 30 秒才向 NameServer 报一次。测试改成 1 秒，让新建的 topic 快点能被发现。
registerNameServerPeriod=1000
storePathRootDir=/tmp/miaosha-rocketmq/store
storePathCommitLog=/tmp/miaosha-rocketmq/store/commitlog
# 代码默认是 1GB。这里用 64MB，避免一上来就占一个 1GB 文件。
mappedFileSizeCommitLog=67108864
# 必须是 20 的倍数。30000 条 * 20 字节。
mappedFileSizeConsumeQueue=600000
transientStorePoolEnable=false
wakeCommitWhenPutMessage=true
flushIntervalCommitLog=500
# 1 和 2 跟发行版默认一样（1s、5s）。3 以及后面改成 1s，重试不用等 10s 和 30s。
messageDelayLevel=1s 5s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s 1s
# 代码默认 6000 和 30000。回查那一组把窗口缩短，才能在这次跑完。
transactionTimeOut=1000
transactionCheckInterval=2000
diskMaxUsedSpaceRatio=95
fileReservedTime=48
deleteWhen=04
