worker_processes 2;
daemon on;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type text/html;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000000;
    server_tokens off;

    # 全局默认关 gzip，只有 18081 打开，用来量压缩的收益
    gzip off;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/css application/json application/javascript text/plain;

    # 全局限流：这台机器上所有压测请求都来自 127.0.0.1，所以按 IP 就是全局。
    limit_req_zone $binary_remote_addr zone=rl:10m rate=5000r/s;
    limit_req_status 503;

    proxy_cache_path cache levels=1:2 keys_zone=edge:16m max_size=128m inactive=60s use_temp_path=off;

    upstream app {
        server 127.0.0.1:18090;
        keepalive 256;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    log_format rt '$request_time $upstream_cache_status $status';

    # 18080 静态页，keep-alive，不压缩
    server {
        listen 18080;
        root static;
        location / {
            try_files $uri =404;
        }
    }

    # 18081 静态页 + gzip
    server {
        listen 18081;
        root static;
        gzip on;
        location / {
            try_files $uri =404;
        }
    }

    # 18082 静态页，关 keep-alive（每个请求一次 TCP）
    server {
        listen 18082;
        root static;
        keepalive_timeout 0;
        location / {
            try_files $uri =404;
        }
    }

    # 18078 静态页 + open_file_cache：少一次 open/stat
    server {
        listen 18078;
        root static;
        open_file_cache max=10000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        location / {
            try_files $uri =404;
        }
    }

    # 18089 静态页但关掉 sendfile：走 read + write 的对照
    server {
        listen 18089;
        root static;
        sendfile off;
        location / {
            try_files $uri =404;
        }
    }

    # 18079 只用来抓 debug 日志，复现 cache lock 的等待时间
    server {
        listen 18079;
        error_log logs/debug.log debug;
        access_log logs/lock.log rt;
        location / {
            proxy_cache edge;
            proxy_cache_key "$host:$server_port$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://app;
        }
    }

    # 18083 纯反代，不缓存
    server {
        listen 18083;
        location / {
            proxy_pass http://app;
        }
    }

    # 18076 边缘缓存 + 过期后先给旧页、后台只回源一次（stale-while-revalidate）
    server {
        listen 18076;
        location / {
            proxy_cache edge;
            proxy_cache_key "$host:$server_port$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating;
            proxy_cache_background_update on;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://app;
        }
    }

    # 18084 边缘缓存 2 秒 + cache lock
    server {
        listen 18084;
        location / {
            proxy_cache edge;
            proxy_cache_key "$host:$server_port$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://app;
        }
    }

    # 18085 边缘缓存 2 秒，关闭 cache lock（回源风暴对照）
    server {
        listen 18085;
        location / {
            proxy_cache edge;
            proxy_cache_key "$host:$server_port$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_lock off;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://app;
        }
    }

    # 18086 限流：burst=1（等于不留突发），多的直接 503
    server {
        listen 18086;
        location / {
            limit_req zone=rl burst=1;
            proxy_pass http://app;
        }
    }

    # 18087 限流：burst=1000 nodelay，突发立刻放行，之后按 5000/s
    server {
        listen 18087;
        location / {
            limit_req zone=rl burst=1000 nodelay;
            proxy_pass http://app;
        }
    }

    # 18088 限流：burst=1000 排队（不加 nodelay），多出来的等，不拒绝
    server {
        listen 18088;
        location / {
            limit_req zone=rl burst=1000;
            proxy_pass http://app;
        }
    }
}
