# 一个进程同时当 broker 和 controller。副本数是 1，没有第二台机器。
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093

listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# 4 个核还要留给压测进程。网络和 IO 线程各 2 个，不是默认的 3 和 8。
num.network.threads=2
num.io.threads=2
num.replica.fetchers=1
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log.dirs=/tmp/miaosha-kafka-data
num.partitions=1
num.recovery.threads.per.data.dir=1

offsets.topic.replication.factor=1
offsets.topic.num.partitions=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# 一次实验里不删段。2GB 只是这次跑完之前的上限，不是线上保留策略。
log.retention.hours=2
log.retention.bytes=2147483648
log.segment.bytes=268435456
log.retention.check.interval.ms=300000

auto.create.topics.enable=false
delete.topic.enable=true
# 默认 3 秒会把消费组的第一次分配拖长，正确性测试不需要这段等待。
group.initial.rebalance.delay.ms=0
